# stress regime: mag 28.8 on a sky 0.0143x LSST i, S/N ~31 (wmom ~23),
# peak source variance ~ sky variance; generated by run_pairs.make_config
detection:
  name: sep
fitter:
  name: wmom
galaxies:
  hlr: 0.5
  mag: 28.8
  morph: exp
  type: fixed
layout:
  buff: 50
  dim: 350
  spacing: 9.5
  type: grid
metacal:
  noise_correction: fusion
  target_psf: azgauss
  types:
  - noshear
  - 1p
  - 1m
  - 2p
  - 2m
noise:
  noise_factor: 0.0143
  source_poisson: false
  type: white
psf:
  dim: 51
  fwhm_max: 2.0
  fwhm_mean: 0.8
  fwhm_min: 0.6
  fwhm_sigma: 0.0
  g_sigma: 0.03
  moffat_beta: 3.5
  noise: 1.0e-06
  type: moffat
shear:
  g1: 0.02
  g2: 0.0
survey:
  bands:
  - i
  name: LSST
